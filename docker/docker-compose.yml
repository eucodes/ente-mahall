name: mahalle-saas

services:
  postgres:
    image: postgres:16-alpine
    container_name: mahalle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mahalle
      POSTGRES_PASSWORD: mahalle
      POSTGRES_DB: mahalle_dev
    ports:
      - "5432:5432"
    volumes:
      - mahalle_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahalle -d mahalle_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mahalle-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - mahalle_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mahalle_postgres_data:
  mahalle_redis_data:
