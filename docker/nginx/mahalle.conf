# Install at /etc/nginx/sites-available/mahalle.conf on the VPS.
# Certificate paths assume a certificate containing the apex and wildcard name.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mahallapp.eucodes.tech *.mahallapp.eucodes.tech;
    return 301 https://$host$request_uri;
}

# api has its own vhost so it is never handled by the frontend wildcard vhost.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mahallapp.eucodes.tech;

    ssl_certificate /etc/letsencrypt/live/mahallapp.eucodes.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahallapp.eucodes.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:4007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mahallapp.eucodes.tech *.mahallapp.eucodes.tech;

    ssl_certificate /etc/letsencrypt/live/mahallapp.eucodes.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahallapp.eucodes.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
