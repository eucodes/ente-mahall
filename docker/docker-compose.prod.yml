# =============================================================================
# Production Docker Compose — Mahalle SaaS
# =============================================================================
#
# Usage on the VPS:
#   IMAGE_TAG=<git-sha> GITHUB_OWNER=<your-gh-username> \
#     docker compose -f docker/docker-compose.prod.yml --env-file .env.prod up -d
#
# All sensitive values come from .env.prod (never committed to git).
# IMAGE_TAG and GITHUB_OWNER can also be placed in .env.prod.
# =============================================================================

name: mahalle-saas-prod

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mahalle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - mahalle_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - mahalle_net

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mahalle-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mahalle_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - mahalle_net

  # ---------------------------------------------------------------------------
  # API (NestJS) — port 4007
  # ---------------------------------------------------------------------------
  api:
    image: ghcr.io/${GITHUB_OWNER}/mahalle-api:${IMAGE_TAG:-latest}
    container_name: mahalle-api
    restart: unless-stopped
    env_file: ../.env.prod
    environment:
      # Overrides / additions on top of .env.prod
      PORT: "4007"
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4007:4007"
    volumes:
      # Persist file uploads across container restarts / redeploys
      - mahalle_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4007/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mahalle_net

  # ---------------------------------------------------------------------------
  # Web (Next.js) — port 3007
  # ---------------------------------------------------------------------------
  web:
    image: ghcr.io/${GITHUB_OWNER}/mahalle-web:${IMAGE_TAG:-latest}
    container_name: mahalle-web
    restart: unless-stopped
    env_file: ../.env.prod
    environment:
      PORT: "3007"
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3007:3007"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3007/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mahalle_net

# ---------------------------------------------------------------------------
# Networks & Volumes
# ---------------------------------------------------------------------------
networks:
  mahalle_net:
    driver: bridge

volumes:
  mahalle_postgres_data:
  mahalle_redis_data:
  mahalle_uploads:
