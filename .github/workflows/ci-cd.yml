name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Typecheck · Lint · Test
  # Runs on all pull requests and pushes to main.
  # ---------------------------------------------------------------------------
  ci:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # ---------------------------------------------------------------------------
  # 2. Build & Push Docker Images
  # Runs automatically on push to main after CI passes.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Environment Variables
        run: |
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}"
          if [ -z "$API_URL" ]; then API_URL="https://api.mahallapp.eucodes.tech/api/v1"; fi
          echo "BUILT_API_URL=$API_URL" >> $GITHUB_ENV
          ROOT_DOM="${{ secrets.NEXT_PUBLIC_ROOT_DOMAIN }}"
          if [ -z "$ROOT_DOM" ]; then ROOT_DOM="mahallapp.eucodes.tech"; fi
          echo "BUILT_ROOT_DOMAIN=$ROOT_DOM" >> $GITHUB_ENV
          VPS_HOST="${{ secrets.VPS_HOST }}"
          VPS_KEY="${{ secrets.VPS_SSH_KEY }}"
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_KEY" ]; then
            echo "HAS_VPS=true" >> $GITHUB_ENV
          else
            echo "HAS_VPS=false" >> $GITHUB_ENV
          fi

      # -----------------------------------------------------------------------
      # Build & Push API Image
      # -----------------------------------------------------------------------
      - name: Build & Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/mahalle-api:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/mahalle-api:staging
            ghcr.io/${{ env.OWNER_LC }}/mahalle-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # -----------------------------------------------------------------------
      # Build & Push Web Image
      # -----------------------------------------------------------------------
      - name: Build & Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/mahalle-web:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/mahalle-web:staging
            ghcr.io/${{ env.OWNER_LC }}/mahalle-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.BUILT_API_URL }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ env.BUILT_ROOT_DOMAIN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # -----------------------------------------------------------------------
      # Auto-Deploy to Staging VPS (only if VPS_HOST secret is configured)
      # -----------------------------------------------------------------------
      - name: Deploy to VPS (Staging)
        if: env.HAS_VPS == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env.prod || \
              echo "IMAGE_TAG=${{ github.sha }}" >> .env.prod

            docker compose -f docker/docker-compose.prod.yml --env-file .env.prod pull api web
            docker compose -f docker/docker-compose.prod.yml --env-file .env.prod up -d --no-deps api web

            echo "Waiting for API health check..."
            for i in $(seq 1 12); do
              if wget -qO- http://localhost:4007/health > /dev/null 2>&1; then
                echo "API is healthy ✓"
                break
              fi
              echo "Attempt $i/12 — retrying in 5s..."
              sleep 5
              if [ "$i" -eq 12 ]; then
                echo "API health check failed after 60s" >&2
                docker compose -f docker/docker-compose.prod.yml logs api | tail -50
                exit 1
              fi
            done

            echo "Staging deploy complete: ${{ github.sha }}"
