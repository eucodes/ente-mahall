name: Build & Push → Deploy Staging

# Runs automatically on every push to main (after CI passes).
# Builds both Docker images, pushes them to ghcr.io, then
# hot-deploys the new images to the VPS as the staging environment.

on:
  push:
    branches: [main]

# Required for pushing to ghcr.io with GITHUB_TOKEN
permissions:
  contents: read
  packages: write

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Run CI first — don't build/push broken code
  # ---------------------------------------------------------------------------
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # Build & push both images, then deploy to staging (VPS)
  # ---------------------------------------------------------------------------
  build-push-deploy:
    name: Build · Push · Deploy (Staging)
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Docker setup
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Build & Push API image
      # -----------------------------------------------------------------------
      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mahalle-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/mahalle-api:staging
          # Layer cache → GitHub Actions cache (speeds up subsequent builds)
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # -----------------------------------------------------------------------
      # Build & Push Web image
      # NEXT_PUBLIC_* vars are baked into the JS bundle at build time —
      # they must be available here, NOT injected at container start.
      # -----------------------------------------------------------------------
      - name: Build & Push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mahalle-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/mahalle-web:staging
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ secrets.NEXT_PUBLIC_ROOT_DOMAIN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # -----------------------------------------------------------------------
      # Deploy to VPS (staging)
      # Pulls the new images and restarts only the changed containers.
      # -----------------------------------------------------------------------
      - name: Deploy to Staging (VPS)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            # Write the image tag so compose picks up the right image
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env.prod || \
              echo "IMAGE_TAG=${{ github.sha }}" >> .env.prod

            # Pull new images from ghcr.io
            docker compose -f docker/docker-compose.prod.yml --env-file .env.prod pull api web

            # Restart only the app containers (postgres & redis are untouched)
            docker compose -f docker/docker-compose.prod.yml --env-file .env.prod up -d --no-deps api web

            # Health check — wait up to 60s for the API to respond
            echo "Waiting for API health check..."
            for i in $(seq 1 12); do
              if wget -qO- http://localhost:4007/health > /dev/null 2>&1; then
                echo "API is healthy ✓"
                break
              fi
              echo "Attempt $i/12 — retrying in 5s..."
              sleep 5
              if [ "$i" -eq 12 ]; then
                echo "API health check failed after 60s" >&2
                docker compose -f docker/docker-compose.prod.yml logs api | tail -50
                exit 1
              fi
            done

            echo "Staging deploy complete: ${{ github.sha }}"
