name: Deploy to Production

# Manually triggered. Choose the exact git SHA image tag you want to promote
# to production (it must already exist in ghcr.io from a previous build-push run).
#
# Uses a GitHub Environment ("production") so you can require approval in
# Settings → Environments → production → Required reviewers.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA to deploy (e.g. a1b2c3d4) — must exist in ghcr.io"
        required: true
        type: string
      run_migrations:
        description: "Run Prisma migrations before starting app containers?"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

jobs:
  deploy-production:
    name: "Deploy ${{ inputs.image_tag }} → Production"
    runs-on: ubuntu-latest
    environment: production   # ← set up Required Reviewers here in repo settings

    steps:
      - name: Validate image tag
        run: |
          if [[ ! "${{ inputs.image_tag }}" =~ ^[a-f0-9]{7,40}$ ]]; then
            echo "ERROR: image_tag must be a valid git SHA (7–40 hex chars)." >&2
            exit 1
          fi

      # -----------------------------------------------------------------------
      # SSH into the VPS and deploy
      # -----------------------------------------------------------------------
      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            echo "=== Promoting image ${{ inputs.image_tag }} to production ==="

            # Update IMAGE_TAG in .env.prod
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ inputs.image_tag }}/" .env.prod || \
              echo "IMAGE_TAG=${{ inputs.image_tag }}" >> .env.prod

            # Pull the specific image tag (both api and web)
            docker compose -f docker/docker-compose.prod.yml --env-file .env.prod pull api web

            # Run DB migrations first (if requested)
            if [ "${{ inputs.run_migrations }}" = "true" ]; then
              echo "--- Running Prisma migrations ---"
              docker compose -f docker/docker-compose.prod.yml --env-file .env.prod \
                run --rm --no-deps api node -e "
                  const { execSync } = require('child_process');
                  execSync('npx prisma migrate deploy --schema ./prisma/schema.prisma', { stdio: 'inherit' });
                "
            fi

            # Rolling restart: bring up new containers, let Docker stop the old ones
            docker compose -f docker/docker-compose.prod.yml --env-file .env.prod \
              up -d --no-deps --remove-orphans api web

            # Health check with retry
            echo "Waiting for API health check..."
            for i in $(seq 1 18); do
              if wget -qO- http://localhost:4007/health > /dev/null 2>&1; then
                echo "API is healthy ✓"
                break
              fi
              echo "Attempt $i/18 — retrying in 5s..."
              sleep 5
              if [ "$i" -eq 18 ]; then
                echo "API health check failed — rolling back to previous image" >&2
                # Rollback: bring up the previously running containers from the
                # docker compose scale record (Docker keeps the old containers
                # stopped until you explicitly remove them with --remove-orphans)
                docker compose -f docker/docker-compose.prod.yml --env-file .env.prod \
                  logs api | tail -100
                exit 1
              fi
            done

            # Clean up dangling images to free disk space
            docker image prune -f

            echo "=== Production deploy complete: ${{ inputs.image_tag }} ==="
